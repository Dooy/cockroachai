
global
  stats socket /var/run/api.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
  log stdout format raw local0 info

defaults
  mode http
  timeout client 120s
  timeout connect 120s
  timeout server 120s
  timeout http-request 120s
  log global

frontend stats
  bind *:8404
  stats enable
  stats uri /
  stats auth cikuu:cikuutest
  stats refresh 10s


frontend suno_30005
  bind *:30005
  mode tcp
  default_backend socks5_30005
  maxconn 6000

frontend suno_30006
  bind *:30006
  mode tcp
  default_backend socks5_30006
  maxconn 6000

# backend http80
#   mode tcp
#   server gz80 45.113.201.68:80

# 上游要求用户名密码认证，探测时声明支持 no-auth(00) + user/pass(02)
backend socks5_30005
  balance roundrobin
  mode tcp
  option tcp-check
  tcp-check connect
  tcp-check send-binary 05020002
  tcp-check expect binary 0502
  server proxy1 38.76.145.31:1080 check inter 10s fall 3 rise 2
  server proxy2 38.97.251.173:1080 check inter 10s fall 3 rise 2
  server proxy3 38.97.251.17:1080 check inter 10s fall 3 rise 2
  server proxy4 154.12.43.135:1080 check inter 10s fall 3 rise 2
